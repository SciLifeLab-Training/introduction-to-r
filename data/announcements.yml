announcements:

  intro: >
    News and updates about Introduction to R. The newest announcements
    are shown first.

  items:

    - date: 2027-02-01
      title: "Registration is open"
      text: >
        You can now register for Introduction to R, until 15 April. Places
        are limited to 25 participants.

    - date: 2027-04-20
      title: "Install R and RStudio before the training"
      text: >
        Please install R and RStudio on your laptop before 10 May, and
        download the course data. The Preparation page explains how.

    - date: 2027-05-10
      title: "Day 1 starts in Air & Fire"
      text: >
        On Monday 17 May, we start at 9:00 in Air & Fire, on the ground
        floor. Coffee is served from 8:30.