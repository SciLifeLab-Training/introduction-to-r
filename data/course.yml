course:

  # This file contains information about the training as a whole.
  # It is used for the landing page, the README and the files that
  # make the training citable and findable (CITATION.cff, .zenodo.json
  # and the Bioschemas markup for training registries such as TeSS).
  #
  # Information about one specific time the training is given (dates,
  # location, schedule, team) belongs on the release-YYMM branch of
  # that training instance, in its own data/course.yml.
  #
  # Use the same title, description, keywords and learning outcomes
  # here as on your release-YYMM branches, so the landing page and the
  # training instances describe the same training.
  #
  # The generator (scripts/generate_landing.py) checks the required
  # fields and stops the website from rendering if any required
  # information is missing.

  # ==================================================
  # Required fields
  # ==================================================
  # title
  # description
  # learning_outcomes
  # keywords
  # reuse.licence


  # ==================================================
  # Optional fields
  # ==================================================
  # subtitle
  # topics
  # language
  # target_audience
  # expertise_level
  # organizers
  # funding
  # reuse.licence_url
  # reuse.licence_id
  # reuse.doi
  # reuse.release_date
  # reuse.website_url
  # reuse.zenodo_communities
  # reuse.preferred_citation


  # --------------------------------------------------
  # Identity
  # --------------------------------------------------
  #
  # Shown at the top of the landing page.

  title: "Introduction to R"
  subtitle: "Learn to explore, analyse and visualise your research data with R"
  description: |
    This training introduces R, a **free and widely used programming language
    for data analysis and statistics**. It is designed for researchers who
    work with data, but have little or no programming experience.

    Through short demonstrations and hands-on exercises, you learn how to
    read data into R, clean and reshape it, summarise it, and create
    publication-quality plots. You work with real research data throughout,
    and leave with code you can reuse for your own projects.

  learning_outcomes:
    - "Use RStudio to write and run R code, and organise your work in projects"
    - "Read data from spreadsheet and text files into R"
    - "Clean, filter and reshape data with the tidyverse"
    - "Summarise data with descriptive statistics"
    - "Create and customise plots with ggplot2"

  keywords:
    - "R"
    - "Data analysis"
    - "Data visualisation"
    - "Reproducible research"

  topics:
    - "R and RStudio basics"
    - "Data import"
    - "Data wrangling with the tidyverse"
    - "Descriptive statistics"
    - "Plotting with ggplot2"

  language: "English"

  target_audience: "Researchers and PhD students in the life sciences who want to analyse their own data, with little or no programming experience"

  expertise_level: "Beginner"

  organizers:
    - "SciLifeLab Training Hub"
    - "Organization X"

  funding:
    - funder: "Introduction to R funder"
      grant_number: "101057388"
      grant_title: "Introduction to R"

  reuse:
    licence: "CC BY 4.0"
    licence_url: "https://creativecommons.org/licenses/by/4.0/"

    # Leave empty. Only needed if you use an unusual licence: then
    # enter its short code from https://spdx.org/licenses/
    licence_id: ""

    # DOI
    # ---
    # The DOI of the training as a whole (the "Cite all versions" DOI
    # on Zenodo). Zenodo creates it when you publish the first
    # training instance. Use the same value as reuse.doi on your
    # release-YYMM branches, for example "10.5281/zenodo.1234567".
    doi: ""

    # release_date: the date the training was first published on Zenodo,
    # written as YYYY-MM-DD (for example "2025-05-12"). 
    release_date: ""

    # Optional fields
    # ---------------
    # Leave these empty unless you need them.

    # The web address of the landing page. When empty, it is worked
    # out automatically. Only needed if the website uses its own
    # domain name.
    website_url: ""

    # Zenodo communities the training should be listed in, for
    # example: ["scilifelab"]
    zenodo_communities: []

    # How others should cite the training. When empty, a citation is
    # created automatically from the team members, year (from
    # release_date), title and DOI.
    preferred_citation: ""
