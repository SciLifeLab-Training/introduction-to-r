course:

  title: "Introduction to R"
  subtitle: "Learn to explore, analyse and visualise your research data with R"
  description: |
    This training introduces R, a free and widely used programming language
    for data analysis and statistics. It is designed for researchers who
    work with data, but have little or no programming experience.

    Through short demonstrations and hands-on exercises, you learn how to
    read data into R, clean and reshape it, summarise it, and create
    publication-quality plots. You work with real research data throughout,
    and leave with code you can reuse for your own projects.

  credits:
    value: 1.5
    unit: "hp"
    note: "Whether the credits count towards your degree is decided by your own university."

  start_date: "2027-05-17"
  end_date: "2027-05-19"

  duration: "3 days"
  mode: "In-person"
  instruction:
    - "Short lectures and live coding demonstrations"
    - "Hands-on exercises with real research data"
    - "Group discussions"

  location: "SciLifeLab, Solna"

  language: "English"

  target_audience: "Researchers and PhD students in the life sciences who want to analyse their own data, with little or no programming experience."
  expertise_level: "Beginner"

  prerequisites:
    knowledge:
      - "Basic knowledge of statistics, such as means and standard deviations"
    technical:
      - "Your own laptop, with R and RStudio installed (see Preparation)"

  learning_outcomes:
    - "Use RStudio to write and run R code, and organise your work in projects"
    - "Read data from spreadsheet and text files into R"
    - "Clean, filter and reshape data with the tidyverse"
    - "Summarise data with descriptive statistics"
    - "Create and customise plots with ggplot2"

  keywords:
    - "R"
    - "Data analysis"
    - "Data visualisation"
    - "Reproducible research"

  examination:
    description: >
      Active participation in all sessions, and a short final exercise
      in which you analyse and plot a dataset of your choice.

  organizers:
    - "SciLifeLab Training Hub"
    - "Organization X"

  content_providers:
    - "NBIS"

  funding:
    - funder: "Introduction to R funder"
      grant_number: "101057388"
      grant_title: "Introduction to R"

  contact:
    email: "intro-r@example.org"

