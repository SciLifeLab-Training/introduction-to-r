practicalities:

  intro: >
    Everything you need to know to find your way to Introduction to R,
    and to make the most of your three days in Solna.

  venue:
    name: "SciLifeLab Solna"
    address: |
      Tomtebodavägen 23A
      171 65 Solna
      Sweden
    room: "Air & Fire (lectures) and the computer room (exercises)"
    instructions: >
      Enter through the main entrance, and collect your visitor badge at
      the reception on the ground floor. Air & Fire is on the ground
      floor, next to the café. Someone from the team will walk you to the
      computer room after the first session.
    map_url: "https://www.openstreetmap.org/?mlat=59.350162&mlon=18.022383#map=19/59.350162/18.022383"

  transport:
    description: >
      The nearest stops are Karolinska institutet västra (bus) and
      Solna station (commuter train), both about a ten-minute walk away.
    links:
      - title: "SL, public transport in Stockholm"
        url: "https://sl.se/en"
    parking: ""

  accommodation:
    description: >
      Accommodation is not included. These hotels are within walking
      distance of the venue.
    hotels:
      - name: "Hotel Example Solna"
        distance: "600 m"
        walking_time: "8 minutes"
        url: "https://example.org/hotel-solna"
      - name: "Example Hostel Hagastaden"
        distance: "1.5 km"
        walking_time: "20 minutes"
        url: ""

  food:
    description: >
      Coffee, tea and fruit are served during the breaks, and lunch is
      included on all three days.
    dietary_information: >
      Tell us about allergies or dietary requirements when you register,
      or email intro-r@example.org at least one week before the training.

  additional:
    - title: "What to bring"
      content: >
        Your own laptop and charger, with R and RStudio installed. See
        the Preparation page for instructions.
    - title: "Wi-Fi"
      content: >
        Use eduroam if your university has it. Otherwise, ask at the
        reception for a guest account.