team:

# REQUIRED 

  # This file contains information about the training team
  # used throughout the website, including the Team page,
  # syllabus, and overview page team preview.
  #
  # Some fields are required and some are optional.
  #
  # The validator (validators.py) checks the required fields
  # and stops the website from rendering if any required
  # information is missing.

  # ==================================================
  # Team data rules
  # ==================================================

  # At least one team member is required.
  
  # Required fields for every team member:
    # - given_names (first name or names)
    # - family_names (surname, including e.g. "van der")
    # - roles
    # - affiliation
  
  # Allowed roles:
    # - Training lead
    # - Instructor
    # - Contributor
  
  # At least one team member must have:
    # - course_contact: true
    # - an email address
  
  # Training leads are optional.

  # On the overview page, up to two team members are shown:
    # 1. Training leads first.
    # 2. Instructors fill any remaining places.
    # 3. Contributors are not shown in the homepage preview.

  # Optional fields for team members:
    # - job_title
    # - email
    # - course_contact
    # - bio
    # - orcid
    # - linkedin
    # - github
    # - website
    # - image
    # - citation_author: set to false to leave this person out of the
    #   citation and the Zenodo record. They are still shown on the
    #   website. Everyone else is included as an author.


  # --------------------------------------------------
  # Page introduction
  # --------------------------------------------------

  intro: >
    Introduction to R is developed and taught by researchers and
    trainers from the SciLifeLab Training Hub and NBIS.

  members:

    - given_names: "Anna"
      family_names: "Lindqvist"
      roles:
        - Training lead
      job_title: "Training coordinator"
      affiliation: "SciLifeLab Training Hub, Uppsala University"
      email: "anna.lindqvist@example.org"
      course_contact: true
      bio: >
        Anna has taught R to life scientists for ten years, and leads
        the development of this training.
      orcid: "https://orcid.org/0000-0002-1825-0097"
      image: "img/photos/team-photo.jpeg"

    - given_names: "Pieter"
      family_names: "van der Berg"
      roles:
        - Instructor
      job_title: "Bioinformatician"
      affiliation: "NBIS, Karolinska Institutet"
      bio: >
        Pieter analyses sequencing data with R every day, and teaches
        the modules on data wrangling and plotting.
      github: "https://github.com/example"
      image: "img/photos/pieter-van-der-berg.jpeg"

    - given_names: "Maria Elena"
      family_names: "Santos"
      roles:
        - Instructor
      affiliation: "Stockholm University"

    - given_names: "Jonas"
      family_names: "Ek"
      roles:
        - Contributor
      affiliation: "SciLifeLab Data Centre"
      citation_author: false