website:

  template: false
  previous_instance_banner: true

  navbar:
    logos:
      - src: "img/scilifelab-logo-full-neg.png"
        alt: "SciLifeLab"
        height: 46
        primary: true

      - src: "img/nbis-neg.png"
        alt: "NBIS"
        height: 26

  welcome:
    title: "Welcome to Introduction to R"
    text: >
      In three days, you learn to read, clean, summarise and plot your
      own research data in R. On this website, you find the schedule,
      the course materials, and everything you need to prepare.
    image:
      src: "img/intro-r-welcome.svg"
      alt: "Welcome illustration"

  registration:
    enabled: true
    opening_date: "2027-02-01"
    closing_date: "2027-04-15"
    after_closing: "closed"
    url: "https://example.org/register/introduction-to-r"
    cost:
      amount: 2500
      currency: "SEK"
      note: >
        Free for PhD students at Swedish universities. Lunch and
        coffee are included.

  pages:

    content:
      title: "Course materials"
      description: "Modules, R scripts and exercises"
      icon: "folder"
      href: "content/index.qmd"
    syllabus:
      title: "Syllabus"
      description: "Learning outcomes, prerequisites and credits"
      icon: "journal-text"
      href: "syllabus.qmd"
    schedule:
      title: "Schedule"
      description: "Three days of lectures and hands-on exercises"
      icon: "calendar2-event"
      href: "schedule.qmd"
    preparation:
      title: "Before you start"
      description: "Install R and RStudio, and download the data"
      icon: "laptop"
      href: "preparation.qmd"
    practicalities:
      title: "Practicalities"
      description: "Venue, travel and lunch"
      icon: "geo-alt"
      href: "practicalities.qmd"
    faq:
      title: "FAQ"
      description: "Answers to common questions"
      icon: "question-circle"
      href: "faq.qmd"



  # ==================================================
  # Announcements section
  # ==================================================
  #
  # Always displayed.
  # Announcements are configured in data/announcements.yml.
  # Without announcements (an empty or deleted announcements.yml), the
  # section shows "No active announcements."

  # ==================================================
  # Team section
  # ==================================================
  #
  # Always displayed. 
  # Team information is configured in data/team.yml.
  #
  # The homepage preview displays up to two team members:
  # 1. Training leads are shown first.
  # 2. Instructors fill any remaining places.
  # 3. Contributors are not shown in the homepage preview.

  # ==================================================
  # Footer
  # ==================================================
  #
  # Always displayed.
  #
  # Most of the footer is filled in automatically, so you don't have
  # to write anything twice:
  #   - the organisation: "organizers" in data/course.yml;
  #   - the licence: "reuse.licence" and "reuse.licence_url" in
  #     data/course.yml;
  #   - the link to your GitHub repository: worked out automatically.
  #
  # Only the text below is set here. You can usually leave it as it is.

  footer:

    # Text describing how the website was built.
    built_with:
      text: "This website was built using the"
      template_name: "SciLifeLab Training Webpage Template"
      template_url: "https://github.com/SciLifeLab-Training/scilifelab-training-template"
      suffix: "and is hosted on GitHub Pages."

    # The icon that links to your GitHub repository.
    repository:
      image: "img/github-neg.png"
      alt: "GitHub repository"

      # The address of your repository is worked out automatically.
      # Only add it here if that doesn't work, for example:
      # url: "https://github.com/organisation/repository"


content:
# Use this section to define the structure and order of
# the training content pages navigation.
#
# First, decide how to organise your training content.
# Divide it into modules or other major sections, and
# create one folder for each section inside the content/
# directory.
#
# Then add one entry below for each folder, in the order
# you want the sections to appear in the navigation.
#
# For each section:
#
# - "id" must match the folder name inside content/.
# - "label" is the short name displayed in the navigation.
# - "title" is used as the navigation button's tooltip text.
#
# For example, an id of "module-1" corresponds to the
# folder content/module-1/.
#
# You can add, remove, rename, or reorder sections to
# match your training structure. If you rename a section,
# make sure to update both the folder name and its id here.


  sections:

    - id: module-1
      label: "Module 1"
      title: "How to structure a page"

    - id: module-2
      label: "Module 2"
      title: "How to highlight information"

    - id: module-3
      label: "Module 3"
      title: "Module 3 Title"