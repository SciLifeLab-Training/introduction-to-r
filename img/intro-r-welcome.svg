<rect width="150" height="44" rx="10" fill="#045C64"/>
<text x="16" y="29" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#FFFFFF">x <tspan fill="#A7C947">&lt;-</tspan> mean(y)</text>
